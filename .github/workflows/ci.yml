# Continuous integration.
# Build, format check, clippy and tests on release platforms, and a build with the
# oldest supported Rust version (MSRV, see rust-version in Cargo.toml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test --all-targets

  msrv:
    name: Build with the oldest supported Rust (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Build
        run: cargo +1.75.0 build --release
      - name: Test
        run: cargo +1.75.0 test
