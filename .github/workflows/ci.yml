# Continuous integration.
# Build, format check, clippy and tests on release platforms, and a build with the
# oldest supported Rust version (MSRV, see rust-version in Cargo.toml).
name: CI

on:
  push:
  pull_request:
  # PRs created with GITHUB_TOKEN need an explicit CI dispatch.
  workflow_dispatch:
  # A release checks the exact prepared commit before it publishes binaries.
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test --all-targets

  msrv:
    name: Build with the oldest supported Rust (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Build
        run: cargo +1.75.0 build --release
      - name: Test
        run: cargo +1.75.0 test

  release-tools:
    name: Check release tools
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version preparation and release authorization
        run: python -m unittest discover -s tools -p 'test_*.py'
