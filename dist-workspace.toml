[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Check the release plan on pull requests without publishing anything.
pr-run-mode = "plan"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Publish only Apple Silicon macOS, x86_64 Linux and x64 Windows binaries.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    # Linux ARM64 releases are paused. Keep this target for possible future use.
    # "aarch64-unknown-linux-gnu",
    # Intel macOS releases are paused. Keep this target for possible future use.
    # "x86_64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
